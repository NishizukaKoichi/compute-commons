[workspace]
members = ["crates/compute-commons-core", "crates/compute-commons-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
authors = ["Compute Commons contributors"]
repository = "https://github.com/NishizukaKoichi/compute-commons"

[workspace.dependencies]
anyhow = "1.0.98"
blake3 = "1.8.5"
clap = { version = "4.6.4", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hex = "0.4.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
wasmtime = { version = "36.0.2", default-features = false, features = ["cranelift", "runtime", "wat"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

